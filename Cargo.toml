[package]
name = "eigentrust"
version = "0.1.0"
edition = "2021"
authors = ["Jenya <hypnagonia@gmail.com>"]
description = "Rust and WASM Eigentrust implementation"
repository = "https://github.com/hypnagonia/eigentrust-rust"

[features]
# Multithreaded WASM (wasm-bindgen-rayon). Needs nightly, +atomics and a cross-origin
# isolated page, see build.sh
parallel = ["dep:wasm-bindgen-rayon", "dep:rayon"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.100"
console_error_panic_hook = "0.1"
console_log = { version = "1.0", features = ["color"]}
wasm-bindgen-rayon = { version = "1.3", optional = true }
rayon = { version = "1.8", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.10"
rayon = "1.8"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
codegen-units = 1
