[workspace]
members = ["cli", "wasm"]
resolver = "2"

[package]
name = "eigentrust"
version = "0.2.0"
edition = "2021"
authors = ["Jenya <hypnagonia@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "EigenTrust reputation algorithm: global trust scores for peer-to-peer networks and social graphs, with Sybil resistance"
repository = "https://github.com/hypnagonia/eigentrust-rust"
homepage = "https://eigentrust.jenyadoesapps.com"
documentation = "https://docs.rs/eigentrust"
readme = "README.md"
keywords = ["eigentrust", "reputation", "trust", "sybil", "pagerank"]
categories = ["algorithms", "mathematics", "science"]
include = [
    "/src/**/*.rs",
    "/tests/**/*.rs",
    "/examples/**/*.rs",
    "/example/*.csv",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[features]
default = []
## Read named peers from CSV (`eigentrust::csv`).
csv = ["dep:csv"]
## Multithreaded power iteration with rayon. On wasm32 this needs a threaded build,
## see the eigentrust-wasm crate.
parallel = ["dep:rayon"]

[dependencies]
csv = { version = "1.3", optional = true }
log = "0.4"
rayon = { version = "1.8", optional = true }

[[example]]
name = "csv"
required-features = ["csv"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[profile.release]
lto = true
codegen-units = 1
