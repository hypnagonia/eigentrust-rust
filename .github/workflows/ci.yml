name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Native, all features
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Native, no features
        run: cargo clippy -p eigentrust --all-targets -- -D warnings
      - name: WebAssembly
        run: cargo clippy -p eigentrust -p eigentrust-wasm --target wasm32-unknown-unknown --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Every feature combination of the library compiles
        run: |
          cargo check -p eigentrust --all-targets
          cargo check -p eigentrust --all-targets --features csv
          cargo check -p eigentrust --all-targets --features parallel
          cargo check -p eigentrust --all-targets --all-features
      - name: Library without features
        run: cargo test -p eigentrust
      - name: Workspace, all features (unit, integration and doc tests)
        run: cargo test --workspace --all-features
      - name: Examples
        run: |
          cargo run --example basic
          cargo run --example csv --features csv

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Build docs as docs.rs does
        run: cargo doc -p eigentrust --all-features --no-deps
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: wasm32-unknown-unknown
      - run: rustup default stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests in Node
        run: wasm-pack test --node --release wasm
      - name: Single-threaded and multithreaded builds
        run: ./build.sh

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Package and build the published crates from their tarballs
        run: cargo package -p eigentrust -p eigentrust-cli
      - name: Library package contents
        run: cargo package -p eigentrust --list

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-machete
      - name: Security advisories
        run: cargo audit
      - name: Unused dependencies
        run: cargo machete

  # Reports public API changes that need a version bump, compared with main.
  # Informational until the first crates.io release; then remove continue-on-error.
  semver:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - run: cargo semver-checks check-release -p eigentrust --baseline-rev origin/${{ github.base_ref }}

  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No Claude / Anthropic co-author trailers
        run: |
          if git log --format='%H%n%B' | grep -qiE 'co-authored-by:.*(claude|anthropic)|generated with .*claude|noreply@anthropic\.com'; then
            echo "Found Claude / Anthropic attribution in commit history" >&2
            git log --format='%h %s' -i -E --grep='co-authored-by:.*(claude|anthropic)' --grep='noreply@anthropic\.com' >&2
            exit 1
          fi
