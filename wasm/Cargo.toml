[package]
name = "eigentrust-wasm"
version = "0.2.0"
edition = "2021"
authors = ["Jenya <hypnagonia@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "WebAssembly bindings for the eigentrust crate"
repository = "https://github.com/hypnagonia/eigentrust-rust"
# distributed as a wasm-pack package, see build.sh
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
## Multithreaded build (wasm-bindgen-rayon). Needs nightly, +atomics and a cross-origin
## isolated page, see build.sh and demo/vercel.json.
threads = ["eigentrust/parallel", "dep:wasm-bindgen-rayon"]

[dependencies]
eigentrust = { version = "0.2.0", path = "..", features = ["csv"] }
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.100"
console_error_panic_hook = "0.1"
console_log = "1.0"
log = "0.4"
wasm-bindgen-rayon = { version = "1.3", optional = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
